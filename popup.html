<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이미지 한글 번역기</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup-body">
  <main class="popup-card">
    <div class="brand-row">
      <div class="brand-mark" aria-hidden="true">あ<span>한</span></div>
      <div>
        <h1>이미지 한글 번역기</h1>
        <p>페이지 원본 이미지의 일본어를 한국어로</p>
      </div>
    </div>

    <button id="translate" class="primary-button" type="button">
      <span>현재 페이지 전체 번역</span>
      <kbd>Alt+Shift+T</kbd>
    </button>
    <button id="clear" class="secondary-button" type="button">번역 지우기</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div class="footer-row">
      <span>일본어 → 한국어 · Local Codex</span>
      <button id="options" class="link-button" type="button">연결 설정</button>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
